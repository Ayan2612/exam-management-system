{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Email verification | JIIT</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"><link href="{% static 'css/student-portal.css' %}" rel="stylesheet"></head>
<body class="student-auth-page"><main class="student-auth-shell"><a class="student-brand" href="{% url 'home' %}"><img src="{% static 'images/jiit-logo.png' %}" alt="JIIT"><span><strong>JIIT Examination Portal</strong><small>Email verification</small></span></a>
<section class="student-auth-card student-message-card"><div class="student-message-icon {% if not verified %}is-error{% endif %}"><i class="bi {% if verified %}bi-check2-circle{% else %}bi-exclamation-circle{% endif %}"></i></div><div class="student-kicker">ACCOUNT VERIFICATION</div><h1>{% if verified %}Email verified{% else %}Verification unsuccessful{% endif %}</h1><p class="student-muted">{{ message }}</p>{% if continue_to_portal %}<a class="student-primary-button student-button-link" href="{% url 'student_dashboard' %}">Open my examination portal</a>{% else %}<a class="student-primary-button student-button-link" href="{% url 'student_login' %}">Continue to sign in</a>{% endif %}</section></main></body></html>
